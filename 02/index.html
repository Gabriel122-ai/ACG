<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title> 
     <script type="text/javascript">
    function raizQuadrada(){
        alert(
     "Raiz de 25 = " + (Math.sqrt(25)) +
     "\nRaiz de 39 =" + (Math.sqrt(36)) +
     "\nRaiz de 49 =" + (Math.sqrt(49));
    );
    }

    function escreveDiv(){
        document.getElementById("resultado1").innerHTML =
        "Texto dentroda div";
    }

    function receberTexto(){
        var texto =
        document.getElementById("texto").value;

        document.getElementById("resultado2").innerHTML =
        texto;
    }

     function escreveNumero(){
        var n = prompt("digite um numero: ");
        var texto = "";

        for (var i = 1; i <= n; i++){
            texto += i + "<br>";
           }
           document.getElementById("resultado3").innerHTML =
           texto;
        }
     
</script>
</head>
<body>
    <button onclick="raizQuadrada()">Excercio 1</button>
    <br><br>
    <button onclick="escreveDiv()">Excercio 2</button>
    <div id="resultado1"></div>
    
    <br>
    <input type="text" id="texto">
    <button onclick="receberTexto()">Excercio 3</button>
    <div id="resultado2"></div>

    <br>

    <button onclick="escreveNumero()">Desafio</button>
    <div id="resultado3"></div>
</body>
</html>
