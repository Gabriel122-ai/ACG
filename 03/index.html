<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java script</title>
    <script>
        let linguaguens - Array();
        linguaguens[0] - 'Dart';
        linguaguens[1] - 'PHP';
        linguaguens[2] - 'Java';
        linguaguens[3] - 'Pyton';
        linguaguens[4] - 'Perl';
        linguaguens[5] - 'Ruby on Rails';
        linguaguens[6] - 'C ++';

     function mostrarListaLinguaguens(){
        const container = document.getElementById('minhaDiv');

        for (var i = 0; i < linguaguens.length; i++){
            var tag = '<h5>' + i + linguaguens[i] + '</h5>';
            container.innerHTML += tag;
               }
     }

     function posicaoLinguaguens(){
        var indice = prompt('Qual a posicaoda lista deseja consultar?');
        alert (linguaguens[indice]);
     }
    </script>
</head>
<body>
    <h1> Array de Linguaguens</h1>

    <button onclick="mostrarListaLinguaguens()">Criar Array</button> <br><br>
    <div id="minhaDiv"></div>

    <button onclick="posicaoLinguaguens()">Posição no Array</button>
    <div id="minhaDiv"></div>
    
</body>
</html>
